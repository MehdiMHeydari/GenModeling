# CNS PRISM sweep exp_29: SPECTRAL-ONLY moments (w_spec=1, amplitude off): isolates the spectral term's effect.
device: cuda
exp_num: 29
path: "cns_student"
th_seed: 1
np_seed: 1

unet:
  dim: [4, 128, 128]
  channel_mult: "1,  2,  4,  4"
  num_channels: 64
  num_res_blocks: 2
  num_head_channels: 32
  attention_resolutions: "32"
  dropout: 0.0
  use_new_attention_order: True
  use_scale_shift_norm: True
  class_cond: False
  num_classes:

cd:
  teacher_checkpoint: "cns_teacher/exp_1/saved_state/checkpoint_599.pt"
  student_steps: 16
  schedule_s: 0.008
  ema_rate: 0.9999
  init_from_teacher: True
  x_var_frac: 0.75
  huber_epsilon: 1e-4
  moment_weight_mu: 0.0
  moment_weight_var: 0.0
  moment_normalized: True
  moment_per_channel: True
  moment_spectral: True
  moment_weight_spec: 1.0
  moment_every: 1
  moment_batch_size: 16
  teacher_moments_path: "cns_teacher/exp_1/saved_state/teacher_moments_v3.pt"

dataloader:
  datapath: "data/cns_128_merged.h5"
  batch_size: 32
  dataset: "VF_FM"
  train_samples: 9000
  loader_type: "cns"

optimizer:
  lr: 1e-4

train:
  num_epochs: 100

  logger_dict:
    format_strs: ["log", "tensorboard"]
    log_print_freq: 5

  checkpointing_dict:
    restart: False
    restart_epoch: null
    save_epoch_int: 25
    log_batch_int: 10
