device: cuda
exp_num: 3
path: "ns_student"
th_seed: 1
np_seed: 1

unet:
  dim: [2, 128, 128]
  channel_mult: "1,  2,  4,  4"
  num_channels: 64
  num_res_blocks: 2
  num_head_channels: 32
  attention_resolutions: "32"
  dropout: 0.0
  use_new_attention_order: True
  use_scale_shift_norm: True
  class_cond: False
  num_classes:

cd:
  # Point to whichever NS teacher checkpoint is freshest at launch time.
  # Teacher is still training; update this to the latest checkpoint you have
  # (e.g. checkpoint_500.pt) before launching this job.
  teacher_checkpoint: "ns_teacher/exp_1/saved_state/checkpoint_500.pt"
  student_steps: 8
  schedule_s: 0.008
  ema_rate: 0.9999
  init_from_teacher: True
  x_var_frac: 0.75
  huber_epsilon: 1e-4

dataloader:
  datapath: "data/ns_incom_128_merged.h5"
  batch_size: 32
  dataset: "VF_FM"
  train_samples: 7000
  loader_type: "ns"

optimizer:
  lr: 1e-4

train:
  num_epochs: 1000

  logger_dict:
    format_strs: ["log", "tensorboard"]
    log_print_freq: 5

  checkpointing_dict:
    restart: False
    restart_epoch: null
    save_epoch_int: 25
    log_batch_int: 10
