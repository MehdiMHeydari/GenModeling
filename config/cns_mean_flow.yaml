device: cuda
exp_num: 1
path: "cns_mean_flow"
th_seed: 1
np_seed: 1

unet:
  dim: [4, 128, 128]
  channel_mult: "1,  2,  4,  4"
  num_channels: 64
  num_res_blocks: 2
  num_head_channels: 32
  attention_resolutions: "32"
  dropout: 0.0
  use_new_attention_order: True
  use_scale_shift_norm: True
  class_cond: False
  num_classes:
  use_future_time_emb: True

mean_flow:
  gamma: 0.0
  t_schedule: "uniform"
  log_norm_args: [-0.4, 1.0]

dataloader:
  datapath: "data/cns_128_merged.h5"
  # batch 4 + accum 2 only used 6.2/49 GB and gave a ~7-day ETA; batch 16
  # fits with large margin and cuts wall time several-fold. Effective batch
  # 16 vs NS's 8 — safe (MeanFlow paper trains at much larger batches).
  batch_size: 16
  dataset: "VF_FM"
  train_samples: 9000
  loader_type: "cns"

optimizer:
  lr: 1e-4

train:
  num_epochs: 1000
  grad_accum_steps: 1

  logger_dict:
    format_strs: ["log", "tensorboard"]
    log_print_freq: 5

  checkpointing_dict:
    # Resuming after the 2026-07-16 server reboot killed the run at ~epoch 390.
    # Last surviving checkpoint: 375.
    restart: True
    restart_epoch: 375
    save_epoch_int: 25
    log_batch_int: 10
