device: cuda
exp_num: 1
path: "ns_teacher"
th_seed: 1
np_seed: 1

unet:
  dim: [2, 128, 128]
  channel_mult: "1,  2,  4,  4"
  num_channels: 64
  num_res_blocks: 2
  num_head_channels: 32
  attention_resolutions: "32"
  dropout: 0.0
  use_new_attention_order: True
  use_scale_shift_norm: True
  class_cond: False
  num_classes:

vp:
  schedule_s: 0.008
  ema_rate: 0.9999

dataloader:
  # Preprocessed NS data (merged from 2 raw 512-resolution files, downsampled
  # to 128). Generated by scripts/preprocess_ns.py. Actual frame count ~8000
  # (each raw file yields ~4000 frames, not 4500 as initially estimated).
  # Split: 7000 train / 1000 test (held-out) — matches Darcy's 1000 test count.
  datapath: "data/ns_incom_128_merged.h5"
  batch_size: 64
  dataset: "VF_FM"
  train_samples: 7000
  loader_type: "ns"

optimizer:
  lr: 1e-4

train:
  num_epochs: 600

  logger_dict:
    format_strs: ["log", "tensorboard"]
    log_print_freq: 5

  checkpointing_dict:
    restart: False
    restart_epoch: null
    save_epoch_int: 25
    log_batch_int: 10
