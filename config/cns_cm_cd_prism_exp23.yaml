# CNS PRISM weight sweep with the NORMALIZED (dimensionless) moment loss.
# exp_22 (unnormalized, Darcy-tuned mu=16/var=150) diverged to structured
# noise: on z-scored CNS the raw variance targets are up to ~3,700x Darcy's
# scale and the moment term buried the consistency loss (best CD loss 0.129
# vs 0.022 for plain CD). The normalized loss divides each squared error by
# its teacher-target scale, making weights dimensionless; Darcy's winner
# corresponds to ~0.3 in these units, so the sweep brackets it: 0.25 / 1 / 4.
# Short diagnostic runs (100 epochs, ckpt every 25) to find the recovery
# region before committing to a full run.
device: cuda
exp_num: 23
path: "cns_student"
th_seed: 1
np_seed: 1

unet:
  dim: [4, 128, 128]
  channel_mult: "1,  2,  4,  4"
  num_channels: 64
  num_res_blocks: 2
  num_head_channels: 32
  attention_resolutions: "32"
  dropout: 0.0
  use_new_attention_order: True
  use_scale_shift_norm: True
  class_cond: False
  num_classes:

cd:
  teacher_checkpoint: "cns_teacher/exp_1/saved_state/checkpoint_599.pt"
  student_steps: 16
  schedule_s: 0.008
  ema_rate: 0.9999
  init_from_teacher: True
  x_var_frac: 0.75
  huber_epsilon: 1e-4
  moment_weight_mu: 0.25
  moment_weight_var: 0.25
  moment_normalized: True
  moment_every: 1
  moment_batch_size: 16
  teacher_moments_path: "cns_teacher/exp_1/saved_state/teacher_moments.pt"

dataloader:
  datapath: "data/cns_128_merged.h5"
  batch_size: 32
  dataset: "VF_FM"
  train_samples: 9000
  loader_type: "cns"

optimizer:
  lr: 1e-4

train:
  num_epochs: 100

  logger_dict:
    format_strs: ["log", "tensorboard"]
    log_print_freq: 5

  checkpointing_dict:
    restart: False
    restart_epoch: null
    save_epoch_int: 25
    log_batch_int: 10
