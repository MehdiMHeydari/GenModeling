device: cuda
exp_num: 1
path: "cns_teacher"
th_seed: 1
np_seed: 1

unet:
  dim: [4, 128, 128]
  channel_mult: "1,  2,  4,  4"
  num_channels: 64
  num_res_blocks: 2
  num_head_channels: 32
  attention_resolutions: "32"
  dropout: 0.0
  use_new_attention_order: True
  use_scale_shift_norm: True
  class_cond: False
  num_classes:

vp:
  schedule_s: 0.008
  ema_rate: 0.9999

dataloader:
  # Preprocessed CNS data: 4 channels (density, pressure, Vx, Vy), 128x128,
  # 10k single snapshots subsampled from 210k available (10k traj x 21 steps).
  # Uses shuffled 9k/1k split from scripts/lock_cns_test_indices.py to avoid
  # the temporal-tail OOD issue we hit on NS.
  datapath: "data/cns_128_merged.h5"
  batch_size: 32
  dataset: "VF_FM"
  train_samples: 9000
  loader_type: "cns"

optimizer:
  lr: 1e-4

train:
  num_epochs: 600

  logger_dict:
    format_strs: ["log", "tensorboard"]
    log_print_freq: 5

  checkpointing_dict:
    restart: False
    restart_epoch: null
    save_epoch_int: 25
    log_batch_int: 10
